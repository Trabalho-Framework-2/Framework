name: Anchieta App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docker_anchieta

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Dm102030
          MYSQL_DATABASE: mysql_anchieta
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 🔄 Checkout do código
        uses: actions/checkout@v3

      - name: 🟢 Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Instalar dependências do projeto (inclui mysql2)
        run: npm install

      - name: 🛠 Instalar Sequelize CLI globalmente
        run: npm install -g sequelize-cli

      - name: 🗃️ Aguardar MySQL subir
        run: sleep 20

      - name: 🔧 Executar migrações do banco
        run: npm run migrate

      - name: 🚀 Iniciar backend em segundo plano
        run: |
          nohup npm start > nohup.out 2>&1 &
          sleep 30

      - name: 🔍 Verificar se o backend está rodando na porta 3000
        run: |
          for i in {1..10}; do
            nc -z localhost 3000 && echo "Servidor está rodando" && exit 0
            echo "Aguardando servidor subir..."
            sleep 5
          done
          echo "Servidor não respondeu na porta 3000"
          cat nohup.out || echo "Sem logs disponíveis"
          exit 1

      - name: ✅ Testar rota inicial /
        run: curl --fail http://localhost:3000 || exit 1

      - name: ✅ Testar rota pública /api/auth/register
        run: |
          curl --fail -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"nome":"teste","email":"teste@anchieta.com","senha":"123456"}' || exit 1

      - name: ✅ Testar rota protegida /api/courses (espera 401 sem token)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/courses)
          if [ "$STATUS" -ne 401 ]; then
            echo "Esperado status 401, mas recebeu $STATUS"
            exit 1
          fi
          echo "Rota protegida respondeu corretamente com 401"

      - name: 🌐 Verificar arquivos do frontend
        run: |
          test -f site/index.html
          test -f site/cadastro.html
          test -f site/listarCurso.html
          test -f site/adicionarCurso.html
          test -f site/css/style.css
          test -f site/js/login.js
          test -f site/js/cadastro.js
          test -f site/js/listarCurso.js
          test -f site/js/adicionarCurso.js

      - name: 🧪 Validar comunicação frontend → backend
        run: |
          curl --fail -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"nome":"frontend","email":"front@anchieta.com","senha":"123456"}' || exit 1

          TOKEN=$(curl -s -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"front@anchieta.com","senha":"123456"}' | jq -r .token)

          curl --fail -X POST http://localhost:3000/api/courses \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"nome":"Engenharia","periodo":"Noturno","modulo":"3"}' || exit 1

          curl --fail -X GET http://localhost:3000/api/courses \
            -H "Authorization: Bearer $TOKEN" || exit 1

      - name: 📄 Verificar logs do backend
        run: cat nohup.out || echo "Sem logs disponíveis"
